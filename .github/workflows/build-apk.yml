name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci || npm install

      - name: 🏗️ Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          packager: npm

      - name: ⚙️ Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Grant execute permissions for gradlew
        run: chmod +x android/gradlew

      - name: 🚀 Build Standalone Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: ✍️ Align and Sign APK (Scheme V2 + V3)
        run: |
          # 1. Locate the unsigned release APK
          RAW_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          # 2. Find Android SDK build-tools path
          BUILD_TOOLS_PATH=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          
          # 3. Align the APK
          $BUILD_TOOLS_PATH/zipalign -v -p 4 $RAW_APK aligned.apk
          
          # 4. Generate universal keystore
          keytool -genkeypair -v -keystore test.keystore -alias testKey -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=QILAV, OU=App, O=Org, C=IN"
          
          # 5. Sign with full modern Android Scheme V2/V3 compatibility
          $BUILD_TOOLS_PATH/apksigner sign --ks test.keystore --ks-key-alias testKey --ks-pass pass:password123 --key-pass pass:password123 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out q-ilav.apk aligned.apk
          
          # 6. Verify signature
          $BUILD_TOOLS_PATH/apksigner verify --verbose q-ilav.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: q-ilav-app
          path: q-ilav.apk
          retention-days: 7