name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci || npm install

      - name: 🏗️ Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          packager: npm

      - name: ⚙️ Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Grant execute permissions for gradlew
        run: chmod +x android/gradlew

      - name: 🚀 Build Standalone Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: ✍️ Sign Release APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKey: ${{ secrets.SIGNING_KEY }}
        continue-on-error: true

      - name: ✍️ Fallback Auto-Sign (Debug Keystore)
        run: |
          # Generate a standard signing key and sign the release apk directly
          keytool -genkeypair -v -keystore release.keystore -alias q-ilav -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=qilav, OU=core, O=ilav, L=Hyd, ST=TG, C=IN"
          
          # Find the unsigned release apk
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          # Sign using jarsigner/apksigner
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass 123456 $APK_PATH q-ilav
          
          mkdir -p output
          cp $APK_PATH output/q-ilav-standalone.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: q-ilav-standalone-apk
          path: output/q-ilav-standalone.apk
          retention-days: 7